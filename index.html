<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGC v12.0 - Brasil ao Cubo</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00B7CC; --dark: #1a1c1e; --bg: #f4f7f6; --white: #ffffff; --green: #92D050; --blue: #9BC2E6; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #333; overflow-x: hidden; }
        .screen { display: none; min-height: 100vh; padding: 20px; flex-direction: column; align-items: center; }
        .screen.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card-auth { background: var(--white); padding: 40px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; width: 100%; max-width: 400px; margin-top: 5vh; border: 1px solid #eee; }
        .logo-login { height: 100px; margin-bottom: 20px; }
        .grid-selection { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; max-width: 700px; margin-top: 30px; }
        .card-type { background: var(--white); padding: 50px 20px; border-radius: 20px; text-align: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header-app { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 20px; background: var(--white); padding: 15px 25px; border-radius: 16px; }
        .table-card { background: white; border-radius: 16px; overflow: hidden; width: 100%; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9fa; padding: 15px; text-align: left; font-size: 12px; color: #888; }
        td { padding: 12px 15px; border-bottom: 1px solid #f1f1f1; font-size: 14px; }
        .check-row { display: grid; grid-template-columns: 1fr 120px 50px; background: white; border-radius: 15px; margin-bottom: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.04); }
        .c-posto { grid-column: 1 / span 3; padding: 10px 15px; font-weight: 700; font-size: 10px; background: #fafafa; border-left: 10px solid var(--green); text-transform: uppercase; }
        .lp-style { border-left-color: var(--blue); }
        .action-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); z-index: 1000; }
        button { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; }
        input[type="checkbox"] { width: 32px; height: 32px; accent-color: var(--primary); }
        textarea { width: 100%; height: 80px; border-radius: 12px; border: 1px solid #ddd; padding: 15px; margin-top: 10px; resize: none; }
        @media (min-width: 1024px) { .check-row { grid-template-columns: 260px 1fr 180px 80px; } .c-posto { grid-column: auto; padding: 20px; } .action-bar { display: grid; grid-template-columns: 1fr 420px; gap: 20px; } }
    </style>
</head>
<body>
    <div id="scr-login" class="screen active">
        <div class="card-auth">
            <img src="https://i.postimg.cc/sfJg4Ykr/br3-imagem.png" class="logo-login">
            <div style="font-weight:700; margin-bottom:20px;">SISTEMA CONFERÊNCIA ONLINE</div>
            <button style="width:100%" onclick="show('scr-start')">ACESSAR</button>
        </div>
    </div>

    <div id="scr-start" class="screen">
        <div class="header-app" style="width:100%; max-width:1100px;">
            <img src="https://i.postimg.cc/sfJg4Ykr/br3-imagem.png" style="height: 35px;">
            <button onclick="show('scr-login')" style="background:#eee; color:#333">Sair</button>
        </div>
        <div class="grid-selection">
            <div class="card-type" onclick="loadList('MODULO')"><h2>🏗️ MÓDULOS</h2></div>
            <div class="card-type" onclick="loadList('POD')"><h2>🚿 PODS</h2></div>
        </div>
    </div>

    <div id="scr-list" class="screen">
        <div style="width:100%; max-width:1100px;">
            <div class="header-app"><h2 id="list-title" style="margin:0">Unidades</h2><button onclick="show('scr-start')" style="background:#eee; color:#333">Voltar</button></div>
            <div class="table-card"><table><thead><tr><th>Projeto</th><th>Express</th><th>OP</th><th>Ação</th></tr></thead><tbody id="body-units"></tbody></table></div>
        </div>
    </div>

    <div id="scr-check" class="screen">
        <div style="width:100%; max-width:1100px; margin-bottom: 260px;">
            <div id="info-header" style="background: var(--dark); color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-around; font-size: 12px;"></div>
            <div id="items-container"></div>
        </div>
        <div class="action-bar">
            <div>
                <div style="display:flex; justify-content:space-between; font-weight:700; font-size:12px;"><span>PROGRESSO</span><span id="pct-txt">0%</span></div>
                <div style="background:#eee; height:10px; border-radius:5px; margin:5px 0; overflow:hidden"><div id="bar-fill" style="background:var(--primary); height:100%; width:0%; transition:0.4s"></div></div>
                <textarea id="obs-main" placeholder="Observações..." oninput="saveOnline()"></textarea>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <button onclick="doPDF()">PDF</button>
                <button style="grid-column: span 2; background:#333" onclick="show('scr-list')">SALVAR E SAIR</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCuI-JSXWNzLCscFowXYZVRHsSN95Z_LEU",
            authDomain: "sistema-conferencia-24505.firebaseapp.com",
            projectId: "sistema-conferencia-24505",
            storageBucket: "sistema-conferencia-24505.firebasestorage.app",
            messagingSenderId: "917410635652",
            appId: "1:917410635652:web:9e5801dda977a9f32187d1",
            databaseURL: "https://sistema-conferencia-24505-default-rtdb.firebaseio.com/"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const dbM = [["7.00.SGC0018","EXPRESS 291","006307"],["7.00.0000015","EXPRESS 292","006306"],["7.00.SGC0017","EXPRESS 293","006308"]];
        const dbP = [["POD 11","7.00.SGC0018","EXPRESS 291","006307"]];
        
        const tM = [{p:"CORTE PILARES", a:"DATA INÍCIO", d:1}, {p:"CORTE PILARES", a:"CONCLUÍDO", c:1}, {p:"VOLUMETRIZAÇÃO", a:"CONCLUÍDO", c:1}];
        const tP = [{p:"CORTE", a:"DATA INÍCIO", d:1}, {p:"METALON", a:"CONCLUÍDO", c:1}];

        let cur = {};

        function show(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
        }

        function loadList(type) {
            const body = document.getElementById('body-units');
            body.innerHTML = "";
            const data = (type === 'MODULO') ? dbM : dbP;
            data.forEach(u => {
                const id = type === 'MODULO' ? u[0] : u[1];
                const exp = type === 'MODULO' ? u[1] : u[2];
                const op = type === 'MODULO' ? u[2] : u[3];
                body.innerHTML += `<tr><td>${id}</td><td>${exp}</td><td>${op}</td><td><button onclick="openCheckOnline('${id}','${exp}','${op}','${type}')">Abrir</button></td></tr>`;
            });
            show('scr-list');
        }

        async function openCheckOnline(id, exp, op, type) {
            cur = { id, exp, op, type, path: exp.replace(/\./g, '_') };
            document.getElementById('info-header').innerHTML = `ID: ${id} | EXP: ${exp} | OP: ${op}`;
            
            const snapshot = await db.ref('conferencias/' + cur.path).once('value');
            const saved = snapshot.val() || {};

            const cont = document.getElementById('items-container');
            cont.innerHTML = "";
            const tasks = (type === 'MODULO') ? tM : tP;

            tasks.forEach((t, i) => {
                cont.innerHTML += `<div class="check-row">
                    <div class="c-posto">${t.p}</div>
                    <div class="c-ativid">${t.a}</div>
                    <div class="c-input">${t.d ? `<input type="date" class="d-in" data-idx="${i}" value="${saved['d_'+i]||''}" onchange="saveOnline()">` : ''}</div>
                    <div class="c-input">${t.c ? `<input type="checkbox" class="c-in" data-idx="${i}" ${saved['c_'+i]?'checked':''} onclick="saveOnline()">` : ''}</div>
                </div>`;
            });
            document.getElementById('obs-main').value = saved.obs || "";
            updateProgress();
            show('scr-check');
        }

        function saveOnline() {
            const data = { obs: document.getElementById('obs-main').value, lastUpdate: Date.now() };
            document.querySelectorAll('.d-in').forEach(el => data['d_'+el.dataset.idx] = el.value);
            document.querySelectorAll('.c-in').forEach(el => data['c_'+el.dataset.idx] = el.checked);
            db.ref('conferencias/' + cur.path).update(data);
            updateProgress();
        }

        function updateProgress() {
            const total = document.querySelectorAll('.c-in').length;
            const checked = document.querySelectorAll('.c-in:checked').length;
            const p = total > 0 ? Math.round((checked/total)*100) : 0;
            document.getElementById('bar-fill').style.width = p + "%";
            document.getElementById('pct-txt').innerText = p + "%";
        }
        
        function doPDF() { window.print(); }
    </script>
</body>
</html>
